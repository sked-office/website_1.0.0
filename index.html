<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKED</title>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Fonts -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/index.css">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap">

  <style>
    :root {
      --background: 260 87% 3%;
      --foreground: 40 6% 95%;
      --hero-sub: 40 6% 82%;
    }

    body {
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: 'Geist Sans', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Liquid Glass Utility Class */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.15) 20%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0.15) 80%,
        rgba(255, 255, 255, 0.45) 100%
      );
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Marquee Infinite Loop Keyframes */
    @keyframes marquee {
      0% {
        transform: translateX(0%);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    .animate-marquee {
      animation: marquee 20s linear infinite;
    }

    .animate-marquee:hover {
      animation-play-state: paused;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const BRAND_LOGOS = [
      { name: 'Sked', initial: 'S' },
      { name: 'Sked', initial: 'S' },
      { name: 'Sked', initial: 'S' },
      { name: 'Sked', initial: 'S' },
      { name: 'Sked', initial: 'S' },
      { name: 'Sked', initial: 'S' },
    ];

    function Hero() {
      return (
        <div className="relative min-h-screen flex flex-col justify-between overflow-hidden bg-[hsl(var(--background))] text-[hsl(var(--foreground))] font-sans">
          {/* BACKGROUND VIDEO WRAPPER */}
          <div className="absolute inset-0 w-full h-full overflow-hidden pointer-events-none">
            <iframe
              className="absolute inset-0 w-full h-full scale-150"
              src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&loop=1&playlist=dQw4w9WgXcQ"
              title="YouTube video"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowFullScreen
            />
          </div>

          {/* RELATIVE CONTENT CONTAINER */}
          <div className="relative z-10 flex flex-col min-h-screen justify-between overflow-visible">
            
            {/* BLURRED OVERLAY SHAPE (CENTERED BEHIND CONTENT) */}
            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[984px] h-[527px] opacity-90 bg-gray-950 blur-[82px] pointer-events-none -z-10" />

            {/* NAVBAR */}
            <header className="w-full">
              <nav className="w-full py-5 px-8 flex flex-row justify-between items-center">
                {/* Left: Logo */}  
                <div className="flex items-center gap-3">
                  <div className="liquid-glass w-10 h-10 rounded-lg flex items-center justify-center text-lg font-bold text-[hsl(var(--foreground))]">
                    S
                  </div>
                  <span className="text-lg font-semibold text-[hsl(var(--foreground))]">
                    Sked
                  </span>
                </div>
                {/* Center: Nav Items */}
                <div className="flex items-center space-x-8">
             <button className="flex items-center gap-1 text-[hsl(var(--foreground))/0.9] hover:text-[hsl(var(--foreground))] transition-colors duration-200 text-sm font-medium">
                    Hompage
                    <svg className="w-4 h-4 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                  </button><button className="flex items-center gap-1 text-[hsl(var(--foreground))/0.9] hover:text-[hsl(var(--foreground))] transition-colors duration-200 text-sm font-medium">
                    Learning Skateboarding
                    <svg className="w-4 h-4 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                  </button><button className="flex items-center gap-1 text-[hsl(var(--foreground))/0.9] hover:text-[hsl(var(--foreground))] transition-colors duration-200 text-sm font-medium">
                    We
                    <svg className="w-4 h-4 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                  </button><button className="flex items-center gap-1 text-[hsl(var(--foreground))/0.9] hover:text-[hsl(var(--foreground))] transition-colors duration-200 text-sm font-medium">
                    Skateboards
                    <svg className="w-4 h-4 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                  </button>
                  <button className="flex items-center gap-1 text-[hsl(var(--foreground))/0.9] hover:text-[hsl(var(--foreground))] transition-colors duration-200 text-sm font-medium">
                    
                    <svg className="w-4 h-4 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                  </button>
                </div>

                {/* Right: CTA */}
                <div>
                  <button className="liquid-glass rounded-full px-4 py-2 text-sm font-medium text-[hsl(var(--foreground))] hover:opacity-90 transition-opacity">
                    Sign in
                  </button>
                </div>
              </nav>

              {/* Divider line with gradient */}
              <div className="w-full h-[1px] bg-gradient-to-r from-transparent via-[hsl(var(--foreground))/0.2] to-transparent mt-[3px]" />
            </header>

            {/* HERO CONTENT (VERTICALLY CENTERED) */}
            <main className="flex-1 flex flex-col items-center justify-center text-center px-4 z-10">
              <h1
                className="text-[220px] font-normal leading-[1.02] tracking-[-0.024em]"
                style={{ fontFamily: "'General Sans', sans-serif" }}
              >
                <span className="text-[hsl(var(--foreground))]"> </span>
                <span
                  className="bg-clip-text text-transparent"      style={{
                    backgroundImage: 'linear-gradient(to left, #6366f1, #a855f7, #fcd34d)',
                  }}
                >
                  SKED
                </span>
              </h1>

              <p className="text-[hsl(var(--hero-sub))] text-lg leading-8 max-w-md mt-[9px] opacity-80">
                The best skate club ever <br />
                is here to help you with your skating journey.
              </p>

              <button className="liquid-glass rounded-full px-[29px] py-[24px] mt-[25px] text-base font-semibold text-[hsl(var(--foreground))] hover:opacity-90 transition-opacity">
                Skateboarding lessons
              </button>
            </main>

            {/* LOGO MARQUEE (PINNED TO BOTTOM) */}
            <footer className="w-full pb-10 z-10">
              <div className="max-w-5xl mx-auto px-6 flex items-center gap-12">
                {/* Left Static Text */}
                <div className="shrink-0 text-[hsl(var(--foreground))/0.5] text-sm leading-tight whitespace-nowrap">
                  Our Sponsors<br />
                  
                </div>

                {/* Right Marquee */}
                <div className="overflow-hidden relative w-full mask-gradient">
                  <div className="flex items-center gap-16 animate-marquee whitespace-nowrap w-max">
                    {/* Double list for seamless marquee looping */}
                    {[...BRAND_LOGOS, ...BRAND_LOGOS].map((brand, index) => (
                      <div key={index} className="flex items-center gap-3 shrink-0">
                        <div className="liquid-glass w-6 h-6 rounded-lg flex items-center justify-center text-xs font-bold text-[hsl(var(--foreground))]">
                          {brand.initial}
                        </div>
                        <span className="text-base font-semibold text-[hsl(var(--foreground))]">
                          {brand.name}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </footer>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Hero />);
  </script>
</body>
</html>
