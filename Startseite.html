<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKATE | Startseite</title>
    <style>
        :root {
            --pink-light: #ffd1e7;
            --pink: #ff9dcc;
            --pink-dark: #d93f82;
            --ink: #11141a;
            --cyan: #42dff0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            color: #ffffff;
            font-family: "Arial Rounded MT Bold", Arial, sans-serif;
            background: var(--cyan);
        }

        .start-page {
            position: relative;
            display: grid;
            min-height: 100vh;
            place-items: center;
            overflow: hidden;
            isolation: isolate;
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.24) 0 2px, transparent 3px),
                radial-gradient(circle at 80% 75%, rgba(255, 255, 255, 0.2) 0 3px, transparent 4px),
                linear-gradient(135deg, #35d7ed 0%, #5de8df 45%, #ff9dcc 160%);
        }

        .back-link {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 5;
            padding: 12px 18px;
            border: 4px solid var(--ink);
            border-radius: 999px;
            color: #ffffff;
            background: var(--pink-dark);
            box-shadow: 5px 6px 0 var(--ink);
            font-weight: 900;
            text-decoration: none;
            transform: rotate(-4deg);
            transition: transform 160ms ease, box-shadow 160ms ease;
        }

        .back-link:hover {
            transform: rotate(-4deg) translateY(-3px);
            box-shadow: 7px 9px 0 var(--ink);
        }

        .hero {
            position: relative;
            width: min(92vw, 1120px);
            height: min(78vh, 720px);
            overflow: hidden;
            border: 8px solid var(--ink);
            border-radius: 28px;
            box-shadow: 18px 22px 0 var(--ink), 0 30px 80px rgba(17, 20, 26, 0.35);
            animation: heroIn 850ms cubic-bezier(0.2, 1.2, 0.3, 1) both;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            filter: saturate(1.15) contrast(1.08);
        }

        .hero::after {
            position: absolute;
            inset: 0;
            content: "";
            background: linear-gradient(135deg, rgba(255, 157, 204, 0.1), rgba(17, 20, 26, 0.4));
            pointer-events: none;
        }

        .wordmark {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 2;
            margin: 0;
            color: var(--pink);
            font-family: "Cooper Black", "Arial Rounded MT Bold", Arial, sans-serif;
            font-size: clamp(4rem, 15vw, 11rem);
            font-weight: 900;
            line-height: 0.8;
            letter-spacing: -0.12em;
            white-space: nowrap;
            -webkit-text-stroke: 7px var(--ink);
            paint-order: stroke fill;
            text-shadow:
                4px 4px 0 var(--pink-light),
                8px 8px 0 var(--pink-dark),
                14px 16px 0 var(--ink),
                0 22px 22px rgba(17, 20, 26, 0.55);
            transform: translate(-50%, -50%) rotate(-7deg) scale(0.25);
            animation: tagIn 1200ms cubic-bezier(0.15, 1.3, 0.35, 1) 350ms forwards;
        }

        .wordmark::before,
        .wordmark::after {
            position: absolute;
            content: "";
            border-radius: 50%;
            background: var(--pink);
            opacity: 0;
            pointer-events: none;
            animation: paintBurst 1100ms ease-out 300ms forwards;
        }

        .wordmark::before {
            width: 16px;
            height: 16px;
            top: 10%;
            left: -15%;
            box-shadow: 38px -28px 0 2px var(--pink-light), 260px 18px 0 1px var(--pink), 390px -38px 0 3px var(--pink-dark);
        }

        .wordmark::after {
            width: 9px;
            height: 9px;
            right: -12%;
            bottom: 4%;
            box-shadow: -42px 20px 0 2px var(--pink-light), -190px 40px 0 1px var(--pink-dark), -330px 12px 0 2px var(--pink);
        }

        .tagline {
            position: absolute;
            right: 7%;
            bottom: 7%;
            z-index: 3;
            margin: 0;
            color: #ffffff;
            font-size: clamp(0.9rem, 2vw, 1.4rem);
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-shadow: 3px 3px 0 var(--ink);
            transform: rotate(-4deg);
            animation: fadeUp 700ms ease-out 1100ms both;
        }

        @keyframes heroIn {
            from { opacity: 0; transform: scale(0.92) rotate(2deg); }
            to { opacity: 1; transform: scale(1) rotate(0); }
        }

        @keyframes tagIn {
            0% { opacity: 0; transform: translate(-50%, -50%) rotate(-18deg) scale(0.25); }
            62% { opacity: 1; transform: translate(-50%, -50%) rotate(5deg) scale(1.08); }
            78% { transform: translate(-50%, -50%) rotate(-9deg) scale(0.96); }
            100% { opacity: 1; transform: translate(-50%, -50%) rotate(-7deg) scale(1); }
        }

        @keyframes paintBurst {
            0% { opacity: 0; transform: scale(0.2); }
            40% { opacity: 0.9; transform: scale(1.2); }
            100% { opacity: 0; transform: scale(1.8); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px) rotate(-4deg); }
            to { opacity: 1; transform: translateY(0) rotate(-4deg); }
        }

        @media (max-width: 600px) {
            .back-link {
                top: 14px;
                left: 14px;
                padding: 9px 13px;
                border-width: 3px;
                box-shadow: 4px 5px 0 var(--ink);
            }

            .hero {
                width: 90vw;
                height: 72vh;
                border-width: 5px;
                border-radius: 20px;
                box-shadow: 10px 13px 0 var(--ink);
            }

            .wordmark {
                font-size: clamp(3.2rem, 18vw, 6rem);
                -webkit-text-stroke: 4px var(--ink);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 1ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <main class="start-page">
        <a class="back-link" href="index.html">&#8592; Zurück</a>
        <section class="hero" aria-label="Skate Startseite">
            <img class="hero-image" src="https://i.etsystatic.com/13015978/r/il/6324c4/6453468991/il_570xN.6453468991_4a4a.jpg" alt="Gruppenfoto">
            <h1 class="wordmark">SKATE</h1>
            <p class="tagline">Ride your own line</p>
        </section>
    </main>
</body>
</html>
